- name: Create group "kayttajat"
  group:
    name: "kayttajat"
    state: present

- name: Create user kayttaja
  user:
    name: kayttaja
    state: present
    create_home: yes

- name: add sudoless rule to kayttajat group
  copy:
    dest: "/etc/sudoers.d/kayttajat"
    content: "%kayttajat ALL = (ALL) NOPASSWD: /usr/bin/systemctl restart caddy"
    owner: root
    group: root
    mode: "0644"
